server:
  port: ${PORT:8090}

spring:
  application:
    name: campusconnect-gateway
  main:
    web-application-type: reactive

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "http://localhost:3002"
              - "http://localhost:3003"
              - "http://localhost:3004"
              - "http://127.0.0.1:3000"
              - "http://127.0.0.1:3001"
              - "http://127.0.0.1:3002"
              - "http://127.0.0.1:3003"
              - "http://127.0.0.1:3004"
            allowed-origin-patterns:
              - "https://*.azurestaticapps.net"
              - "https://*.azurewebsites.net"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: false
            max-age: 3600

      routes:
        - id: user-service-route
          uri: ${services.user.url:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**,/api/v1/auth/**
          filters:
            - AddResponseHeader=X-Gateway-Route, user-service
            - AddResponseHeader=X-Gateway-Target-Port, 8081

        - id: apartment-service-route
          uri: ${services.apartment.url:http://localhost:8080}
          predicates:
            - Path=/api/v1/apartments/**
          filters:
            - AddResponseHeader=X-Gateway-Route, apartment-service
            - AddResponseHeader=X-Gateway-Target-Port, 8080

        - id: chat-service-route
          uri: ${services.chat.url:http://localhost:8082}
          predicates:
            - Path=/api/v1/messages/**,/api/v1/conversations/**
          filters:
            - AddResponseHeader=X-Gateway-Route, chat-service
            - AddResponseHeader=X-Gateway-Target-Port, 8082

        - id: chat-websocket-route
          uri: ${services.chat.url:http://localhost:8082}
          predicates:
            - Path=/ws,/ws/**
          filters:
            - AddResponseHeader=X-Gateway-Route, chat-service-ws
            - AddResponseHeader=X-Gateway-Target-Port, 8082

        - id: carona-service-route
          uri: ${services.carona.url:http://localhost:8083}
          predicates:
            - Path=/api/v1/rides/**,/api/v1/ride-requests/**
          filters:
            - AddResponseHeader=X-Gateway-Route, carona-service
            - AddResponseHeader=X-Gateway-Target-Port, 8083

services:
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  apartment:
    url: ${APARTMENT_SERVICE_URL:http://localhost:8080}
  chat:
    url: ${CHAT_SERVICE_URL:http://localhost:8082}
  carona:
    url: ${CARONA_SERVICE_URL:http://localhost:8083}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.campusconnect.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.web.reactive: INFO
